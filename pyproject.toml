[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "graph-orchestrator"
version = "0.1.0"
description = "Decoupled, Agnostic Multi-Agent CLI Orchestrator for Engineering Pipelines"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "AntaresAndBharani" }
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "textual>=0.50.0",
    "pydantic>=2.6.0",
    "pyyaml>=6.0.1",
    "aiosqlite>=0.20.0",
    "python-dotenv>=1.0.0",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.12.0",
]

[project.scripts]
orchestrator = "orchestrator.cli:app"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["orchestrator"]
