# ==============================================================================
# Graph Orchestrator Configuration Template (v2)
# ==============================================================================
# Save this file to ~/.config/orchestrator/config.yaml (Linux/macOS)
# or %USERPROFILE%/.orchestrator/config.yaml (Windows)

version: 2

# Global Engine Settings
settings:
  poll_interval_seconds: 300          # 5 minutes idle sweep interval
  supervisor_interval_seconds: 3600   # 1 hour consistency supervisor check
  max_concurrent_jobs: 4              # Concurrency threshold to prevent RAM exhaustion
  db_path: "~/.config/orchestrator/state.db"
  log_dir: "~/.config/orchestrator/logs"
  log_level: "INFO"

# Standard Repository Workflow Taxonomy
managed_labels:
  - name: "needs-triage"
    color: "E2B7E1"
    description: "Awaiting Architect Node triage and decomposition"
  - name: "ready-for-dev"
    color: "0E8A16"
    description: "Awaiting 3Amigos DevTest implementation"
  - name: "needs-architect-review"
    color: "FBCA04"
    description: "PR submitted, ready for architectural review"
  - name: "dev-implemented"
    color: "C2E0C6"
    description: "Implementation completed by DevTest node"
  - name: "orchestration-failed"
    color: "B60205"
    description: "AI Harness execution failed"
  - name: "needs-po-review"
    color: "D93F0B"
    description: "Supervisor flagged methodological conflict"
  - name: "architect-processed"
    color: "D4C5F9"
    description: "Architect decomposition complete"

# Pluggable AI CLI Harness Adapters
# CLIs inherit active local OAuth user subscriptions (zero raw API token charges).
harnesses:
  claude:
    binary: "claude"
    args: ["-p", "{prompt}", "--dangerously-skip-permissions"]
    model_flag: "--model"
    effort_flag: "--effort"           # Claude CLI supports level of effort flag (--effort low|medium|high|max)
    timeout_minutes: 30
    retry_on_failure: 1

  antigravity:
    binary: "agy"
    args: ["-p", "{prompt}", "--dangerously-skip-permissions", "--print-timeout", "45m"]
    model_flag: "--model"
    effort_flag: "--effort"           # Antigravity CLI supports level of effort flag (--effort low|medium|high)
    timeout_minutes: 45
    retry_on_failure: 1

  devin:
    binary: "devin"
    args: ["-p", "{prompt}", "--permission-mode", "bypass"]
    model_flag: "--model"             # Devin model selection is managed via model name
    timeout_minutes: 60
    retry_on_failure: 1

# Managed Projects Registry
projects:
  - name: "project-alpha"
    repo: "my-org/project-alpha"
    local_path: "~/workspaces/project-alpha"  # Cross-platform path expansion (supports ~, $HOME, %USERPROFILE%, or relative paths)
    enabled: true
    context_files:
      - "docs/ARCHITECTURE.md"
      - "docs/METHODOLOGY.md"
    nodes:
      supervisor:
        enabled: true
        harness: "claude"
        model: "claude-haiku-4-5"     # Fast, cost-efficient model for supervisor diagnosis
        effort: "medium"              # Fast, lightweight consistency check
      architect:
        enabled: true
        harness: "claude"
        model: "claude-sonnet-5"
        effort: "medium"              # High reasoning effort for architectural decomposition
        label_trigger: "needs-triage"
        label_output: "ready-for-dev"
      devtest:
        enabled: true
        harness: "antigravity"
        model: "gemini-3.7-flash-medium"  # Antigravity specifies reasoning effort in model name
        label_trigger: "ready-for-dev"
        label_output: "needs-architect-review"
        branch_prefix: "feat/issue-"
        auto_merge_approved: true
      reviewer:
        enabled: true
        harness: "claude"
        model: "claude-sonnet-5"
        effort: "medium"
        label_trigger: "needs-architect-review"
        auto_merge_approved: true
