# ==============================================================================
# Graph Orchestrator Configuration Template (v2)
# ==============================================================================
# Save this file to ~/.config/orchestrator/config.yaml (Linux/macOS)
# or %USERPROFILE%/.orchestrator/config.yaml (Windows)

version: 2

# Global Engine Settings
settings:
  poll_interval_seconds: 180          # 3 minutes idle sweep interval
  supervisor_interval_seconds: 3600   # 1 hour consistency supervisor check
  bau_interval_seconds: 86400         # 1 day / 24 hours interval for BAU maintenance
  max_concurrent_jobs: 4              # Concurrency threshold to prevent RAM exhaustion
  db_path: "~/.config/orchestrator/state.db"
  log_dir: "~/.config/orchestrator/logs"
  log_level: "INFO"
  max_planned_stories: 2              # Maximum planned stories in lookahead window
  lookahead_backoff_seconds: 1200     # 20 minutes backoff cadence for Architect on empty backlog
  worktrees_enabled: true             # Enable isolated Git worktrees for concurrent devtest tasks
  worktree_dir: null                  # Custom base directory for worktrees (null uses default project path)

# Standard Repository Workflow Taxonomy
managed_labels:
  - name: "needs-triage"
    color: "E2B7E1"
    description: "Awaiting Architect Node triage and decomposition"
  - name: "ready-for-dev"
    color: "0E8A16"
    description: "Awaiting 3Amigos DevTest implementation"
  - name: "queued"
    color: "D4C5F9"
    description: "Subtask queued, awaiting sequential activation"
  - name: "architect-processed"
    color: "D4C5F9"
    description: "Architect decomposition complete"
  - name: "dev-implemented"
    color: "C2E0C6"
    description: "Implementation completed by DevTest node"
  - name: "needs-refactor"
    color: "D93F0B"
    description: "PR requires remediation or CI fixes, returned to DevTest"
  - name: "orchestration-failed"
    color: "B60205"
    description: "AI Harness execution failed"

# Pluggable AI CLI Harness Adapters
# CLIs inherit active local OAuth user subscriptions (zero raw API token charges).
harnesses:
  claude:
    binary: "claude"
    args: ["-p", "{prompt}", "--dangerously-skip-permissions"]
    model_flag: "--model"
    effort_flag: "--effort"           # Claude CLI supports level of effort flag (--effort low|medium|high|max)
    timeout_minutes: 30
    retry_on_failure: 1
    retry:
      max_retries: 3
      initial_delay_seconds: 5.0
      backoff_factor: 2.0
      max_delay_seconds: 60.0
      retryable_patterns:
        - "503"
        - "UNAVAILABLE"
        - "429"
        - "RESOURCE_EXHAUSTED"
        - "502"
        - "504"
        - "rate limit"
        - "quota exceeded"
        - "connection reset"
        - "server disconnected"
        - "fetch failed"

  antigravity:
    binary: "agy"
    args: ["-p", "{prompt}", "--dangerously-skip-permissions", "--print-timeout", "45m"]
    model_flag: "--model"
    effort_flag: "--effort"           # Antigravity CLI supports level of effort flag (--effort low|medium|high)
    timeout_minutes: 45
    retry_on_failure: 1
    retry:
      max_retries: 3
      initial_delay_seconds: 5.0
      backoff_factor: 2.0
      max_delay_seconds: 60.0

  devin:
    binary: "devin"
    args: ["-p", "{prompt}", "--permission-mode", "bypass"]
    model_flag: "--model"             # Devin model selection is managed via model name
    timeout_minutes: 60
    retry_on_failure: 1

# Token Quota & Velocity Gating Settings
# Configures rolling window limits and consumption rates per AI harness pool.
quota:
  buffer_minutes: 30                  # Pre-flight runway requirement before dispatching tasks
  harnesses:
    antigravity:
      window_hours: 1.0               # 1-hour rolling window
      window_token_limit: 2000000     # 2.0M tokens per window
      avg_tokens_per_hour: 400000     # Baseline velocity estimate
      weekly:
        hours: 168.0                  # Weekly rolling window (7 days)
        token_limit: 20000000         # 20.0M weekly token ceiling
    claude:
      window_hours: 5.0               # 5-hour rolling window
      window_token_limit: 5000000     # 5.0M tokens per window
      avg_tokens_per_hour: 300000     # Baseline velocity estimate
      weekly:
        hours: 168.0                  # Weekly rolling window (7 days)
        token_limit: 20000000         # 20.0M weekly token ceiling
    devin:
      window_hours: 5.0               # 5-hour rolling window
      window_token_limit: 2500000     # 2.5M tokens per window
      avg_tokens_per_hour: 150000     # Baseline velocity estimate
      weekly:
        hours: 168.0                  # Weekly rolling window (7 days)
        token_limit: 10000000         # 10.0M weekly token ceiling
    openai:
      window_hours: 1.0               # 1-hour rolling window
      window_token_limit: 1500000     # 1.5M tokens per window
      avg_tokens_per_hour: 300000     # Baseline velocity estimate
      weekly:
        hours: 168.0                  # Weekly rolling window (7 days)
        token_limit: 10000000         # 10.0M weekly token ceiling

# Managed Projects Registry
projects:
  - name: "project-alpha"
    repo: "my-org/project-alpha"
    local_path: "~/workspaces/project-alpha"  # Cross-platform path expansion (supports ~, $HOME, %USERPROFILE%, or relative paths)
    enabled: true
    max_planned_stories: 2                   # Optional per-project lookahead cap override
    worktrees_enabled: true                  # Optional per-project worktree toggle override
    worktree_dir: null                       # Optional custom worktree directory (supports ~, $HOME, %USERPROFILE%)
    context_files:
      - ".graph/architecture.md"
      - ".graph/testing-standards.md"
      - ".graph/git-workflow.md"
    nodes:
      architect:
        enabled: true
        harness: "antigravity"
        model: "gemini-3.8-flash-high"
        label_trigger: "needs-triage" # Ingest trigger label (e.g. 'needs-triage' or 'stream out')
        processed_label: "architect-processed" # Transition label applied to parent story upon decomposition
        queued_label: "queued"        # Initial state label assigned to all generated subtasks
        label_output: "ready-for-dev"
        research_harness: "antigravity"
        research_model: "gemini-3.8-flash-high"
        research_interval_seconds: 604800  # 7 days (weekly evolutionary architecture refresh)
      devtest:
        enabled: true
        harness: "claude"
        model: "claude-sonnet-5"
        effort: "medium"
        label_trigger: "ready-for-dev"    # Active trigger label for subtask execution
        queued_label: "queued"            # Inactive subtask state awaiting sequential activation
        label_output: "dev-implemented"   # Completion label applied upon PR implementation
        branch_prefix: "feat/issue-"
        auto_merge_approved: true
      reviewer:
        enabled: false
      supervisor:
        enabled: false
      bau:
        enabled: false
